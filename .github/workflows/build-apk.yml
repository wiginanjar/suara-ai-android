name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        run: |
          PROJECT_DIR=$(dirname "$(find . -name "settings.gradle.kts" | head -n 1)")
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: File settings.gradle.kts tidak ditemukan!"
            exit 1
          fi
          echo "Menjalankan build di folder: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuaraAI-Studio-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
